services:
  lan-orangutan:
    image: ghcr.io/291-group/lan-orangutan:3.4.2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      ORANGUTAN_PORT: 8385
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/lan-orangutan
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8385/static/orangutan.svg"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 8385

x-runtipi:
  schema_version: 2
