services:
  lan-orangutan:
    image: ghcr.io/291-group/lan-orangutan:3.4.2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      ORANGUTAN_PORT: 291
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/lan-orangutan
    security_opt:
      - no-new-privileges:true
    x-runtipi:
      is_main: true
      internal_port: 291

x-runtipi:
  schema_version: 2
