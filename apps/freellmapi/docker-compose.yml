services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.19
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ${APP_DATA_DIR}/data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 3001

x-runtipi:
  schema_version: 2
